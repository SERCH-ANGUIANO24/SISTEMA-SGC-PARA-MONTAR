<VirtualHost *:80>
    ServerName 192.168.0.118
    DocumentRoot /var/www/html/sistemasgc/public

    <Directory /var/www/html/sistemasgc/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laravel-error.log
    CustomLog ${APACHE_LOG_DIR}/laravel-access.log combined
</VirtualHost>
